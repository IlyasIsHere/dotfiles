# Forward extended key sequences to applications
set -s extended-keys on
set -g extended-keys-format csi-u

set -g default-terminal "tmux-256color"

set -as terminal-features ',xterm-kitty:RGB'
set -as terminal-features ',xterm-kitty:extkeys'

# Enable mouse
set -g mouse on

# Claude Code compatibility with tmux
set -g allow-passthrough on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set prefix 
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Shift Alt Vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Fast vim-aware pane navigation (replaces vim-tmux-navigator's tmux side).
# Uses tmux's native pane_current_command instead of spawning `ps | grep` on
# every keypress. The Neovim side (vim-tmux-navigator.lua) still handles splits.
set -g @is_vim "#{m/ri:^(g?(view|l?n?vim?x?)|fzf)$,#{pane_current_command}}"
bind -n C-h if-shell -F '#{E:@is_vim}' 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell -F '#{E:@is_vim}' 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell -F '#{E:@is_vim}' 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell -F '#{E:@is_vim}' 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell -F '#{E:@is_vim}' 'send-keys C-\\' 'select-pane -l'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Morantron/tmux-fingers'

set -g @continuum-restore 'on'

# Set vi-mode
set-window-option -g mode-keys vi
# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
# set -g @catppuccin_window_status_style "rounded"
set-window-option -g window-status-separator ''

# Show window names in the status bar
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
